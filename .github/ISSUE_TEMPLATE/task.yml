name: 연구 작업
description: tasks.csv의 작업 ID를 기준으로 진행·검수 기록
title: "[TASK-ID] 작업명"
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: management/tasks.csv에 있는 ID
    validations:
      required: true
  - type: input
    id: owner_due
    attributes:
      label: 담당 / 마감
  - type: textarea
    id: deliverables
    attributes:
      label: 산출물·검수 기준
  - type: textarea
    id: links
    attributes:
      label: 결과 링크·검수·미해결 문제
